# Minimal PR-validation pipeline materialized by scaffold-project.
#
# Triggers on draft PRs (opened/synchronize/reopened) and on a draft being
# marked ready for review. Validates the surfaces that landed in this scaffold:
# per-stack lint/type/format/test, per-stack DIFF-SCOPED mutation test, per-stack
# docker image build, then a full stack-up E2E run.
#
# The mutation job is the deterministic discharge of pattern-test-coverage's
# deletable-code lens (a surviving mutant = a line the code could get wrong with
# the suite still green). It runs `bash scripts/mutation.sh` scoped to the branch
# diff and uploads the surviving-mutant report as an artifact — deliberately a
# SEPARATE job, never folded into ci-checks.sh / the pre-push hook, because it runs
# the suite once per mutant (too slow for the interactive path, fast scoped to a diff).
#
# CI parity: each per-stack check job runs `bash scripts/ci-checks.sh` — the
# SAME script the committed local pre-push hook (.githooks/pre-push) runs. The
# commands live in <stack>/scripts/ci-checks.sh, never inline here, so local
# and CI cannot drift. A push that would fail CI is denied locally first.
#
# Job blocks for backend and frontend are present only if the scaffold landed
# that surface. The skill removes blocks that do not apply when it renders this
# file.

name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- BEGIN backend (python-fastapi) ----
  backend-checks:
    name: backend · lint/type/format/test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.11"
      - name: Install dependencies
        run: uv sync --all-extras --dev || uv sync --dev
      - name: CI checks (lint + format + type + tests, single-sourced)
        # Byte-identical to what the local pre-push hook runs. The script owns
        # ruff + ruff format --check + mypy + the full pytest suite, and spins
        # up an ephemeral Postgres so DB/integration tests actually run. Keeping
        # the commands in scripts/ci-checks.sh (not inline here) is what stops
        # "what CI runs" and "what the hook runs" from ever drifting apart.
        run: bash scripts/ci-checks.sh

  backend-mutation:
    name: backend · diff-scoped mutation
    needs: backend-checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so scripts/mutation.sh can diff this branch vs the PR base.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.11"
      - name: Install dependencies
        run: uv sync --all-extras --dev || uv sync --dev
      - name: Mutation test (diff-scoped — deletable-code lens, deterministic)
        # Single-sourced runner (parallel to ci-checks.sh): mutates ONLY the lines
        # this branch changed vs the PR base, exits non-zero on a surviving mutant.
        # Kept out of ci-checks.sh / the pre-push hook because it runs the suite once
        # per mutant — too slow for the interactive path, fast enough scoped to a diff.
        run: bash scripts/mutation.sh "origin/${{ github.base_ref }}"
      - name: Upload surviving-mutant report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-mutation-report
          path: backend/mutation-report.txt
          if-no-files-found: ignore

  backend-build:
    name: backend · docker build
    needs: backend-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
  # ---- END backend (python-fastapi) ----

  # ---- BEGIN frontend (react-vite) ----
  frontend-checks:
    name: frontend · lint/type/format/test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci || npm install
      - name: CI checks (lint + format + type + tests, single-sourced)
        # Byte-identical to what the local pre-push hook runs. The script owns
        # biome ci + tsc --noEmit + vitest run. Keeping the commands in
        # scripts/ci-checks.sh (not inline here) is what stops "what CI runs"
        # and "what the hook runs" from ever drifting apart.
        run: bash scripts/ci-checks.sh

  frontend-mutation:
    name: frontend · diff-scoped mutation
    needs: frontend-checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so Stryker's --since can diff this branch vs the PR base.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci || npm install
      - name: Mutation test (diff-scoped — deletable-code lens, deterministic)
        # Single-sourced runner (parallel to ci-checks.sh): Stryker --since mutates
        # ONLY the files this branch changed vs the PR base, exits non-zero when a
        # mutant survives. Kept out of ci-checks.sh / the pre-push hook — it runs the
        # suite once per mutant, too slow for the interactive path.
        run: bash scripts/mutation.sh "origin/${{ github.base_ref }}"
      - name: Upload surviving-mutant report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-mutation-report
          path: frontend/mutation-report.txt
          if-no-files-found: ignore

  frontend-build:
    name: frontend · docker build
    needs: frontend-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
  # ---- END frontend (react-vite) ----

  e2e:
    name: e2e · playwright vs compose
    needs: [backend-build, frontend-build]
    runs-on: ubuntu-latest
    env:
      BACKEND_PORT: "8000"
      FRONTEND_PORT: "5173"
      BASE_URL: "http://localhost:5173"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Bring up stack
        run: docker compose up -d --build
      - name: Wait for frontend
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "http://localhost:${FRONTEND_PORT}/" >/dev/null; then
              echo "frontend up"
              exit 0
            fi
            sleep 2
          done
          echo "frontend did not become reachable" >&2
          exit 1
      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci
      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        working-directory: e2e
        run: npm test
      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down stack
        if: always()
        run: docker compose down -v
