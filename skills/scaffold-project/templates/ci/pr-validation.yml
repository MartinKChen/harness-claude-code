# Minimal PR-validation pipeline materialized by scaffold-project.
#
# Triggers on draft PRs (opened/synchronize/reopened) and on a draft being
# marked ready for review. Validates the surfaces that landed in this scaffold:
# per-stack lint/type/format/test, per-stack docker image build, then a full
# stack-up E2E run.
#
# Job blocks for backend and frontend are present only if the scaffold landed
# that surface. The skill removes blocks that do not apply when it renders this
# file.

name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- BEGIN backend (python-fastapi) ----
  backend-checks:
    name: backend · lint/type/format/test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.11"
      - name: Install dependencies
        run: uv sync --all-extras --dev || uv sync --dev
      - name: Lint (ruff check)
        run: uv run ruff check .
      - name: Format check (ruff format --check)
        run: uv run ruff format --check .
      - name: Type check (mypy)
        run: uv run mypy app
      - name: Tests (pytest)
        # Tolerate exit 5 (no tests collected) — scaffold ships no feature tests.
        run: uv run pytest || [ $? -eq 5 ]

  backend-build:
    name: backend · docker build
    needs: backend-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
  # ---- END backend (python-fastapi) ----

  # ---- BEGIN frontend (react-vite) ----
  frontend-checks:
    name: frontend · lint/type/format/test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci || npm install
      - name: Lint/format (biome)
        # biome ci runs the linter, formatter (check mode, no writes), and
        # import organization in one pass; non-zero exit on any violation.
        run: npx biome ci .
      - name: Type check (tsc)
        run: npm run typecheck
      - name: Tests (vitest)
        # --passWithNoTests so an empty test set is not a failure at scaffold time.
        run: npx vitest run --passWithNoTests

  frontend-build:
    name: frontend · docker build
    needs: frontend-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
  # ---- END frontend (react-vite) ----

  e2e:
    name: e2e · playwright vs compose
    needs: [backend-build, frontend-build]
    runs-on: ubuntu-latest
    env:
      BACKEND_PORT: "8000"
      FRONTEND_PORT: "5173"
      BASE_URL: "http://localhost:5173"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Bring up stack
        run: docker compose up -d --build
      - name: Wait for frontend
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "http://localhost:${FRONTEND_PORT}/" >/dev/null; then
              echo "frontend up"
              exit 0
            fi
            sleep 2
          done
          echo "frontend did not become reachable" >&2
          exit 1
      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci
      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        working-directory: e2e
        run: npm test
      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down stack
        if: always()
        run: docker compose down -v
